name: Linux and Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test -race -cover ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/claude-session-sync .
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/claude-session-sync-arm64 .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test -cover ./...
      - run: go vet ./...
      - run: go build -trimpath -o dist/windows-amd64/claude-session-sync.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/windows-amd64/claude-session-sync.exe
